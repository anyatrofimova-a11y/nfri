name: Deploy site to GitHub Pages

on:
  push:
    branches: [framework]
    paths:
      - "site/**"
      - "harness/build_frontend.py"
      - "harness/build_essays.py"
      - "harness/design_system.py"
      - "contract/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild static site
        run: python3 harness/build_frontend.py

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true

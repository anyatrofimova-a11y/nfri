# Fly.io config for the NFRI static site (site/).
# First deploy: fly launch --no-deploy  (accept or edit app name + region)
# Then:        fly deploy

app = 'princesp-npir'
primary_region = 'lhr'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
